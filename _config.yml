# Welcome to Jekyll!
locale: 'zh-CN'
title: 'zcq100技术博客'
# masthead_title: "My Custom Title"
email: m@zcq100.com
github_username:  zcq100
url: "https://blog.zcq100.com"
baseurl: ""
description: >
  Python、Linux、Docker、AI开发、网络与自动化运维实践

include: ["_pages"]

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      show_date: true
      read_time: true
      share: true
      comments: true
      related: true
      author_profile: true

  - scope:
      path: ""
      type: tag
    values:
      author_profile: true
      comments: false

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      comments: false

category_archive:
  type: jekyll-archives
  path: /categories/
tag_archive:
  type: jekyll-archives
  path: /tags/

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive-taxonomy
    tag: archive-taxonomy
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

date_format: "%Y-%m-%d"
timezone: Asia/Shanghai
search: true

author:
  name: "zcq100"
  avatar: "/assets/images/avatar.jpg"
  bio: "Python开发者，专注AI工程化、Linux运维与自动化开发"
  location: "China"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/zcq100"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "contrast"

paginate: 5
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-archives

exclude:
  - Gemfile
  - Gemfile.lock

comments:
  provider: 'disqus'
  disqus:
    shortname: zcq100-1